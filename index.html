  <style>

}.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.reading{overflow:hidden}.reading-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;padding:21px 23px;border-bottom:1px solid var(--line)}.reading h2{font:700 24px Georgia,serif;margin:0 0 4px}.meta{font-size:13px;color:var(--muted)}.reader-actions{display:flex;gap:8px}.icon-btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;white-space:nowrap}.sentences{padding:9px 0}.sentence{display:grid;grid-template-columns:40px 1fr;gap:10px;padding:15px 22px;border-left:4px solid transparent;cursor:pointer;transition:.18s}.sentence:hover{background:#f7f7f1}.sentence.active{background:#fff7d9;border-left-color:var(--yellow)}.num{font:700 13px Georgia,serif;color:#84908f;padding-top:5px}.en{font:18px/1.65 Georgia,"Times New Roman",serif}.zh{font-size:13px;color:var(--muted);margin-top:4px}.side{display:grid;gap:17px;align-content:start}.practice,.insights{padding:21px}.practice-top{display:flex;justify-content:space-between;align-items:center}.practice h3,.insights h3{margin:0;font-size:16px}.score{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--teal) 0 0%,var(--pale) 0);position:relative;font-weight:800}.score:after{content:"";position:absolute;inset:6px;background:var(--paper);border-radius:50%}.score span{z-index:1}.quote{margin:20px 0 12px;padding-left:15px;border-left:3px solid var(--yellow);font:18px/1.55 Georgia,serif;cursor:pointer}.word-result{display:flex;flex-wrap:wrap;gap:5px;min-height:26px;margin:10px 0;font:15px Georgia,serif}.word-result .ok{color:var(--teal)}.word-result .miss{color:var(--red);background:#fde5df;border-radius:4px;padding:0 3px}.wave{height:42px;display:flex;align-items:center;justify-content:center;gap:4px;margin:5px 0}.wave i{display:block;width:3px;border-radius:3px;background:#bdd5cf;height:var(--h);transition:.15s}.recording .wave i{background:var(--coral);animation:pulse .7s ease-in-out infinite alternate;animation-delay:var(--d)}@keyframes pulse{to{height:8px}}.record{width:100%;border:0;border-radius:12px;padding:14px;background:var(--coral);color:#fff;font-weight:800;cursor:pointer;box-shadow:0 5px 0 #c64938}.record.recording{background:var(--ink);box-shadow:0 5px 0 #080f10}.feedback{margin-top:14px;padding:13px;border-radius:12px;background:var(--pale);font-size:14px}.feedback b{color:var(--teal)}audio{width:100%;height:35px;margin-top:10px}.tabs{display:flex;gap:6px;margin:15px 0}.tabs button{flex:1;border:0;background:#eef0ea;border-radius:8px;padding:8px;font-size:13px;cursor:pointer}.tabs button.active{background:var(--ink);color:#fff}.insight-list{display:grid;gap:9px}.insight-item{padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:13px}.insight-item strong{color:var(--coral);font-size:14px}.insight-item small{display:block;color:var(--muted);margin-top:3px}.empty{color:var(--muted);font-size:13px}.modal{position:fixed;inset:0;background:rgba(9,23,24,.66);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.open{display:flex}.dialog{width:min(680px,100%);background:var(--paper);border-radius:20px;padding:25px;box-shadow:0 24px 80px rgba(0,0,0,.27)}.dialog-head{display:flex;justify-content:space-between;align-items:start;gap:16px}.dialog h2{font:700 26px Georgia,serif;margin:0}.dialog p{color:var(--muted);margin:5px 0 18px}.ghost{background:transparent;font-size:24px}.drop{display:block;border:1px dashed #aab6b2;border-radius:12px;padding:12px;margin-bottom:12px;text-align:center;color:var(--teal);cursor:pointer}.drop input{display:none}textarea{width:100%;min-height:230px;resize:vertical;border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff;font:16px/1.55 Georgia,serif;color:var(--ink);outline:none}textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px #dcece8}.dialog-actions{display:flex;justify-content:space-between;align-items:center;margin-top:14px}.hint{font-size:13px;color:var(--muted)}.toast{position:fixed;right:24px;bottom:24px;background:var(--ink);color:#fff;padding:12px 16px;border-radius:10px;box-shadow:var(--shadow);opacity:0;transform:translateY(8px);pointer-events:none;transition:.2s;z-index:30}.toast.show{opacity:1;transform:none}@media(max-width:940px){.app{grid-template-columns:1fr}.rail{display:none}.main{padding:20px}.workspace{grid-template-columns:1fr}.side{grid-template-columns:1fr 1fr}.topbar h1{font-size:28px}}@media(max-width:680px){.main{padding:14px}.side{grid-template-columns:1fr}.sentence{padding:14px 15px}.reading-head{padding:17px}.topbar{align-items:flex-end}.topbar h1{font-size:24px}.primary{padding:10px 12px}.reader-actions .icon-btn:first-child,.hint{display:none}.dialog{padding:19px}}
  </style>
</head>
<body>
<div class="app">
  <aside class="rail"><div class="brand"><span class="mark">句</span><span>句读</span></div><nav class="nav" aria-label="主导航"><button class="active">▤ 今日精读</button><button id="historyBtn">◷ 学习记录</button><button id="vocabBtn">◇ 生词本</button></nav><div class="lesson-mini"><p>本次完成进度</p><strong id="doneText">0 / 4 句</strong><div class="rail-progress" style="margin-top:14px"><span id="doneBar" style="width:0"></span></div></div></aside>
  <main class="main"><header class="topbar"><div><div class="eyebrow">Close Reading · 跟读训练</div><h1>把一篇文章，真正读懂</h1></div><button class="primary" id="openImport">导入文章 ＋</button></header>
  <section class="workspace"><article class="card reading"><div class="reading-head"><div><h2 id="articleTitle">The Power of Small Habits</h2><div class="meta" id="articleMeta"></div></div><div class="reader-actions"><button class="icon-btn" id="toggleZh">译 中</button><button class="icon-btn" id="playAll">▶ 全文</button></div></div><div class="sentences" id="sentences"></div></article>
  <aside class="side"><section class="card practice" id="practiceCard"><div class="practice-top"><div><div class="eyebrow" id="sentenceLabel">Sentence 01</div><h3>逐句跟读</h3></div><div class="score" id="scoreRing"><span id="scoreValue">—</span></div></div><div class="quote" id="practiceText" title="点击听原音"></div><div class="word-result" id="wordResult"></div><div class="wave" id="wave" aria-hidden="true"></div><button class="record" id="recordBtn">● 开始跟读</button><audio id="playback" controls hidden></audio><div class="feedback" id="feedback"><b>先听，再读。</b><br>点击英文句子可先听标准发音。</div></section>
  <section class="card insights"><h3>本句精读</h3><div class="tabs" id="tabs"><button class="active" data-tab="vocab">词汇</button><button data-tab="phrase">短语</button><button data-tab="pattern">句型</button></div><div class="insight-list" id="insightList"></div></section></aside></section></main>
</div>
<div class="modal" id="importModal" role="dialog" aria-modal="true" aria-labelledby="importTitle"><div class="dialog"><div class="dialog-head"><div><h2 id="importTitle">导入一篇英语文章</h2><p>粘贴新概念、四级或任意英文短文，系统会自动拆句并整理学习重点。</p></div><button class="ghost" id="closeImport" aria-label="关闭">×</button></div><label class="drop">选择 .txt 文件<input type="file" id="fileInput" accept=".txt,text/plain"></label><textarea id="articleInput" placeholder="在这里粘贴英文文章……">Small changes often lead to remarkable results over time. When a behavior is repeated, it gradually becomes part of who we are. The key is not to aim for perfection, but to remain consistent. Even five minutes of daily practice can make a meaningful difference.</textarea><div class="dialog-actions"><span class="hint">建议 80–500 词，英文标点会自动拆句</span><button class="primary" id="analyzeBtn">开始精读 →</button></div></div></div>
<div class="toast" id="toast"></div>
<script>
var seed=[{en:"Small changes often lead to remarkable results over time.",zh:"微小的改变，往往会随着时间带来显著的结果。"},{en:"When a behavior is repeated, it gradually becomes part of who we are.",zh:"当一种行为不断重复，它会逐渐成为我们自身的一部分。"},{en:"The key is not to aim for perfection, but to remain consistent.",zh:"关键不在于追求完美，而在于保持持续。"},{en:"Even five minutes of daily practice can make a meaningful difference.",zh:"哪怕每天只练习五分钟，也能带来有意义的变化。"}];
var dictionary={remarkable:["显著的","/rɪˈmɑːrkəbəl/"],gradually:["逐渐地","/ˈɡrædʒuəli/"],consistent:["持续一致的","/kənˈsɪstənt/"],meaningful:["有意义的","/ˈmiːnɪŋfəl/"],behavior:["行为","/bɪˈheɪvjər/"],perfection:["完美","/pərˈfekʃn/"],difference:["差异；改变","/ˈdɪfrəns/"],practice:["练习","/ˈpræktɪs/"],results:["结果","/rɪˈzʌlts/"],changes:["改变","/ˈtʃeɪndʒɪz/"]};
var phraseRules=[["lead to","导致；通向"],["over time","久而久之"],["become part of","成为……的一部分"],["aim for","以……为目标"],["not to","不要；并非去"],["make a difference","产生影响"],["even if","即使"],["as a result","因此"],["in order to","为了"],["rather than","而不是"],["be able to","能够"]];
var sentences=seed,active=0,tab="vocab",showZh=true,completed=new Set(),mediaRecorder=null,chunks=[],recognition=null,isRecording=false;
var $=function(s){return document.querySelector(s)},$$=function(s){return Array.from(document.querySelectorAll(s))};
function esc(s){return s.replace(/[&<>'"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]})}
function toast(msg){var el=$("#toast");el.textContent=msg;el.classList.add("show");setTimeout(function(){el.classList.remove("show")},2200)}
function words(t){return t.toLowerCase().replace(/[^a-z' ]/g,"").split(/\s+/).filter(Boolean)}
function level(t){var w=words(t),avg=w.reduce(function(n,x){return n+x.length},0)/Math.max(w.length,1);return avg>6?"B2":avg>4.8?"B1":"A2"}
function render(){var html=sentences.map(function(s,i){return '<div class="sentence '+(i===active?"active":"")+'" data-i="'+i+'" tabindex="0"><span class="num">'+String(i+1).padStart(2,"0")+'</span><div><div class="en">'+esc(s.en)+'</div><div class="zh" '+(showZh?"":"hidden")+'>'+esc(s.zh||"译文可在深入学习时补充")+'</div></div></div>'}).join("");$("#sentences").innerHTML=html;$$(".sentence").forEach(function(el){function pick(){selectSentence(+el.dataset.i)}el.onclick=pick;el.onkeydown=function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();pick()}}});var all=sentences.map(function(x){return x.en}).join(" ");$("#articleMeta").textContent="难度 "+level(all)+" · "+sentences.length+" 句 · 约 "+words(all).length+" 词";renderPractice();updateProgress()}
function selectSentence(i){active=i;$("#scoreValue").textContent="—";$("#scoreRing").style.background="conic-gradient(var(--teal) 0 0%,var(--pale) 0)";$("#wordResult").innerHTML="";$("#feedback").innerHTML="<b>先听，再读。</b><br>点击「开始跟读」，完成后会标出需要再练的词。";render()}
function renderPractice(){var t=sentences[active]?sentences[active].en:"";$("#sentenceLabel").textContent="Sentence "+String(active+1).padStart(2,"0");$("#practiceText").textContent=t;renderInsights()}
function insights(text,type){var lower=text.toLowerCase(),ws=words(text);if(type==="vocab"){return Array.from(new Set(ws.filter(function(w){return dictionary[w]||w.length>=9}))).slice(0,5).map(function(w){return {title:w,detail:dictionary[w]?dictionary[w].join(" · "):"长难词 · 建议结合语境记忆"}})}if(type==="phrase"){return phraseRules.filter(function(x){return lower.indexOf(x[0])>=0}).map(function(x){return {title:x[0],detail:x[1]}}).slice(0,5)}var out=[];if(/^when\b/i.test(text))out.push({title:"When + 从句, 主句",detail:"时间/条件状语从句：当……时"});if(/not to .+ but to/i.test(text))out.push({title:"not to A, but to B",detail:"不是要 A，而是要 B"});if(/can\s+\w+/i.test(text))out.push({title:"can + 动词原形",detail:"表示能力或可能性"});if(/\b(is|are|was|were)\b/.test(lower))out.push({title:"be + 过去分词 / 表语",detail:"观察被动语态或主系表结构"});return out.slice(0,4)}
function renderInsights(){var a=insights(sentences[active].en,tab);$("#insightList").innerHTML=a.length?a.map(function(x){return '<div class="insight-item"><strong>'+esc(x.title)+'</strong><small>'+esc(x.detail)+'</small></div>'}).join(""):'<div class="empty">本句没有明显的这一类重点。</div>'}
function updateProgress(){var n=completed.size,p=Math.round(n/sentences.length*100)||0;$("#doneText").textContent=n+" / "+sentences.length+" 句";$("#doneBar").style.width=p+"%"}
function speak(text){speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text||sentences[active].en);u.lang="en-US";u.rate=.84;speechSynthesis.speak(u)}
async function startRecording(){if(isRecording){stopRecording();return}var stream;try{stream=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){toast("需要允许麦克风权限才能跟读");return}chunks=[];mediaRecorder=new MediaRecorder(stream);mediaRecorder.ondataavailable=function(e){chunks.push(e.data)};mediaRecorder.onstop=function(){var url=URL.createObjectURL(new Blob(chunks,{type:"audio/webm"}));$("#playback").src=url;$("#playback").hidden=false;stream.getTracks().forEach(function(t){t.stop()})};mediaRecorder.start();isRecording=true;$("#practiceCard").classList.add("recording");$("#recordBtn").classList.add("recording");$("#recordBtn").textContent="■ 完成并评分";$("#feedback").innerHTML="<b>正在聆听……</b><br>自然地读完整句，不必刻意放慢。";var SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){recognition=new SR();recognition.lang="en-US";recognition.interimResults=true;recognition.continuous=true;recognition.onresult=function(e){var said="";for(var i=0;i<e.results.length;i++)said+=e.results[i][0].transcript+" ";window.lastTranscript=said.trim()};recognition.onerror=function(){};try{recognition.start()}catch(e){}}else window.lastTranscript=""}
function stopRecording(){if(!isRecording)return;isRecording=false;mediaRecorder&&mediaRecorder.stop();try{recognition&&recognition.stop()}catch(e){}$("#practiceCard").classList.remove("recording");$("#recordBtn").classList.remove("recording");$("#recordBtn").textContent="● 再读一次";setTimeout(function(){grade(window.lastTranscript||"")},650)}
function grade(spoken){var target=words(sentences[active].en),heard=words(spoken);if(!heard.length){$("#feedback").innerHTML="<b>录音已保存。</b><br>浏览器没有返回识别结果，请使用 Chrome/Edge，或播放录音自行对照。";$("#wordResult").innerHTML=target.map(function(w){return "<span>"+esc(w)+"</span>"}).join(" ");return}var hit=0,used=new Set(),okList=[];var marked=target.map(function(w,i){var ok=heard[i]===w;if(!ok){var j=heard.findIndex(function(h,k){return !used.has(k)&&h===w});if(j>=0){ok=true;used.add(j)}}else used.add(i);okList.push(ok);if(ok)hit++;return '<span class="'+(ok?"ok":"miss")+'">'+esc(w)+"</span>"});var score=Math.max(35,Math.round(hit/target.length*100));$("#wordResult").innerHTML=marked.join("");$("#scoreValue").textContent=score;$("#scoreRing").style.background="conic-gradient(var(--teal) 0 "+score+"%,var(--pale) "+score+"% 100%)";var missed=target.filter(function(x,i){return !okList[i]}).slice(0,3);$("#feedback").innerHTML=score>=90?"<b>很自然，节奏也很好！</b><br>这句已经掌握，可以继续下一句。":"<b>"+(score>=75?"整体很清楚，再精修一下。":"慢一点，先把关键词读准。")+"</b><br>"+(missed.length?"重点重读："+missed.map(esc).join(" · "):"注意连读与句子重音。");completed.add(active);updateProgress()}
function importArticle(text){var clean=text.replace(/\s+/g," ").trim(),parts=clean.match(/[^.!?]+[.!?]+[\"']?|[^.!?]+$/g);parts=(parts||[]).map(function(s){return s.trim()}).filter(function(s){return /[a-z]/i.test(s)});if(!parts.length){toast("没有识别到英文句子");return false}sentences=parts.slice(0,30).map(function(en){return {en:en,zh:""}});active=0;completed.clear();$("#articleTitle").textContent="My Reading · 我的精读";$("#importModal").classList.remove("open");render();toast("已拆分 "+sentences.length+" 句，并完成学习重点整理");return true}
$("#wave").innerHTML=Array.from({length:42},function(_,i){return '<i style="--h:'+(9+Math.abs(Math.sin(i*.72))*28)+'px;--d:'+(i*-24)+'ms"></i>'}).join("");
$("#openImport").onclick=function(){$("#importModal").classList.add("open")};$("#closeImport").onclick=function(){$("#importModal").classList.remove("open")};$("#importModal").onclick=function(e){if(e.target.id==="importModal")e.currentTarget.classList.remove("open")};$("#analyzeBtn").onclick=function(){importArticle($("#articleInput").value)};$("#fileInput").onchange=function(e){var file=e.target.files[0];if(!file)return;var r=new FileReader();r.onload=function(){$("#articleInput").value=r.result};r.readAsText(file)};$("#toggleZh").onclick=function(){showZh=!showZh;$("#toggleZh").textContent=showZh?"译 中":"译 隐";render()};$("#playAll").onclick=function(){speak(sentences.map(function(x){return x.en}).join(" "))};$("#practiceText").onclick=function(){speak()};$("#recordBtn").onclick=startRecording;$("#tabs").onclick=function(e){if(!e.target.dataset.tab)return;tab=e.target.dataset.tab;$$('#tabs button').forEach(function(b){b.classList.toggle("active",b===e.target)});renderInsights()};$("#historyBtn").onclick=function(){toast("本次已完成 "+completed.size+" 句跟读")};$("#vocabBtn").onclick=function(){tab="vocab";$$('#tabs button').forEach(function(b){b.classList.toggle("active",b.dataset.tab==="vocab")});renderInsights();$(".insights").scrollIntoView({behavior:"smooth"})};document.addEventListener("keydown",function(e){if(e.key==="Escape")$("#importModal").classList.remove("open")});
if(document.modelContext&&document.modelContext.registerTool){try{document.modelContext.registerTool({name:"import_english_article",title:"导入英语文章",description:"导入英文文章并拆分为逐句精读内容。",inputSchema:{type:"object",properties:{text:{type:"string",minLength:10}},required:["text"],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:true},execute:function(input){if(!input||typeof input.text!=="string"||input.text.trim().length<10)throw new Error("文章至少需要 10 个字符");if(!importArticle(input.text))throw new Error("没有识别到英文句子");return {sentenceCount:sentences.length,title:$("#articleTitle").textContent}}})}catch(e){}}
render();
</script>
</body></html>
